data_root: official_test_dataset/Data
output_dir: artifacts/m1_fusion_logit_mean_e1
cache_dir: cache/m0_full
ppg_cache_dir: cache/m1_ppg
model: m1_imu_ppg
model_mode: fusion
m1_loss_mode: global_bce
m1_fusion_mode: logit_mean
m1_embedding_dim: 64
m1_modality_dropout: 0.25
resample_hz: 25
max_gap_ms: 2000
preprocess_variant: p0_raw_mask
ppg_preprocess_variant: raw_mask
ppg_flat_policy: reject_constant_stream
ppg_max_dense_samples: 1000000
window_sec: 15
step_sec: 3
seed: 7
chunksize: 50000
label_positive_overlap: 0.25
boundary_mode: soft
event_iou_threshold: 0.25
